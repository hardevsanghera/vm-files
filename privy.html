<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #06281e;
      color: #ecfdf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .policy-card {
      background-color: #06281e;
      color: #ecfdf5;
      border: 2px solid #34d399;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 28px -8px rgba(0, 0, 0, 0.35);
    }

    h1 {
      color: #34d399;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }

    p {
      color: #ecfdf5;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="policy-card">
    <h1>Privacy Policy</h1>
    <p>Your data is not collected, you have nothing to fear</p>
  </main>
</body>
</html>
