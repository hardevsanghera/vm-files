<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a; /* Deep slate blue background */
      color: #f8fafc;            /* Crisp off-white text */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .policy-card {
      background-color: #1e293b; /* Slightly lighter slate card */
      border: 2px solid #38bdf8; /* Bright sky-blue border */
      border-radius: 16px;
      padding: 3rem 3.5rem;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: #38bdf8;            /* Sky-blue heading */
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.5;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <main class="policy-card">
    <h1>Privacy Policy:</h1>
    <p>Your data is not collected, you have nothing to fear</p>
  </main>
</body>
</html>
